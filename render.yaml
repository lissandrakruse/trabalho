services:
  - type: web
    runtime: static
    name: trabalho-probabilidades-solo
    buildCommand: echo "Static site ready"
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /data/*
        name: Cache-Control
        value: public, max-age=86400
